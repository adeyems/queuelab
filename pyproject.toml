[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "queuelab"
version = "0.1.0"
description = "QueueLab: local synthetic developer workflow tooling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
queuelab = "queuelab:main"

[tool.setuptools]
py-modules = ["queuelab"]
